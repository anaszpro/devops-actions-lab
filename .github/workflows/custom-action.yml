name: Custom JavaScript action

on: workflow_dispatch

permissions: {}

jobs:
  use-action:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke versioned greeting action
        id: greet
        uses: anaszpro/devops-greeting-action@v1.0.0
        with:
          name: Anas
      - name: Verify the greeting output
        env:
          GREETING: ${{ steps.greet.outputs.greeting }}
        run: |
          printf 'Action output: %s\n' "$GREETING"
          test "$GREETING" = "Hello, Anas!"
