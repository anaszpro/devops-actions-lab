name: Variables secrets and token

on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository variable and masked demo secret
        env:
          LAB_GREETING: ${{ vars.LAB_GREETING }}
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          test -n "$LAB_GREETING" || { echo "Create the LAB_GREETING variable"; exit 1; }
          test "$MY_SECRET" = actions-lab-demo-blue || { echo "Use the lab-only demo secret from the guide"; exit 1; }
          printf '::add-mask::%s\n' "$MY_SECRET"
          printf 'Repository variable: %s\nMasked demo secret: %s\n' "$LAB_GREETING" "$MY_SECRET"
      - name: Check out using the job token
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read repository data through REST and Git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq .full_name
          git ls-remote --exit-code origin HEAD
